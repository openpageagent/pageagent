name: Package and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-server/package-lock.json

      - name: Verify tag matches manifest version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(node -p "require('./manifest.json').version")"
          mcp_version="$(node -p "require('./mcp-server/package.json').version")"
          test "$tag_version" = "$manifest_version"
          test "$tag_version" = "$mcp_version"

      - name: Install root dependencies
        run: npm ci

      - name: Install MCP Server dependencies
        run: npm ci --prefix mcp-server

      - name: Build release package
        run: ./page-agent-build.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/page-agent-extension-*.zip
